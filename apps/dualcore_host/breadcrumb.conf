#
# Optional bench diagnostic, NOT applied by default -- see ../Kconfig's
# CONFIG_DEMO_EXECUTION_BREADCRUMB help text and src/main.c's top-of-file
# comment above breadcrumb_mark_early() for what this turns on and how to
# read the result off a memory dump. Pass this fragment explicitly:
#
#   west build ... apps/dualcore_host -- -DEXTRA_CONF_FILE=breadcrumb.conf
#
# Independent of ram-console.conf -- combine both with a semicolon-separated
# list if wanted:
#
#   west build ... apps/dualcore_host -- -DEXTRA_CONF_FILE="ram-console.conf;breadcrumb.conf"
CONFIG_DEMO_EXECUTION_BREADCRUMB=y
