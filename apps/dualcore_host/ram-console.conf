#
# Optional bench override, NOT applied by default -- prj.conf's
# CONFIG_UART_CONSOLE=y stays the default for a customer carrier with a
# routed UART. Pass this fragment explicitly to switch the host's console to
# RAM instead:
#
#   west build ... apps/dualcore_host -- -DEXTRA_CONF_FILE=ram-console.conf
#
# CONFIG_RAM_CONSOLE backs a fixed symbol, `ram_console_buf`, that a debugger
# can read over SWD regardless of which UART (if any) is physically wired on
# a given bench -- see the root README.md and docs/BENCH-DUALCORE.md. Both
# CONFIG_RAM_CONSOLE and CONFIG_UART_CONSOLE install their own printk/stdout
# hook (see zephyr/drivers/console/ram_console.c), so leaving both enabled
# makes whichever driver initializes last win by accident; CONFIG_UART_CONSOLE=n
# here makes the swap unambiguous instead. UART console output is disabled
# while this fragment is applied.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=2048
CONFIG_UART_CONSOLE=n

# MANDATORY with the line above -- without it this whole fragment is a silent
# no-op that produces an empty buffer and reads as "the app printed nothing".
#
# zephyr/subsys/logging/backends/Kconfig.uart:5-7 makes LOG_BACKEND_UART
# `depends on UART_CONSOLE`, so CONFIG_UART_CONSOLE=n above removes the ONLY
# registered log backend. This app logs exclusively through LOG_* (there is no
# bare printk in src/main.c), and with zero backends the log core formats every
# message and then discards it -- it never reaches the __printk_hook that
# ram_console.c installs, so `ram_console_buf` stays all-zero no matter what
# the app did. Measured on the pre-fix build: _log_backend_list_start ==
# _log_backend_list_end == 0x8030825c, i.e. an empty backend list.
#
# LOG_MODE_MINIMAL selects PRINTK and layers logging straight onto printk,
# which IS the hook ram_console owns. Chain, verified by symbol on the built
# ELF: z_log_minimal_printk -> printk -> ram_console_out.
#
# Re-derive `ram_console_buf`'s address with `nm` for EVERY build -- adding
# this option moves it (0x20000acb -> 0x20000ab6 between two builds that
# differed only by this line).
CONFIG_LOG_MODE_MINIMAL=y
