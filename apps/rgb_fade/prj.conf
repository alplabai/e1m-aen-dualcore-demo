#
# rgb_fade -- plain Zephyr, no Alp Lab SDK on any path.

# The PWM class driver plus the Alif UTIMER backend. CONFIG_PWM_ALIF_UTIMER
# is `default y` once DT_HAS_ALIF_PWM_ENABLED is true (the board overlay
# enables the pwm10/pwm11 children), and it `select`s the hal_alif UTIMER
# register library -- do not set USE_ALIF_HAL_UTIMER here, it is select-only.
CONFIG_PWM=y

# The pwm-leds consumer node the app resolves its handles from. The Zephyr
# led_pwm driver instantiates it; the app does not call the LED API, it only
# needs the node bound so PWM_DT_SPEC_GET can dereference its `pwms` phandle.
CONFIG_LED=y
CONFIG_LED_PWM=y

# Console + logging: the app prints which controller/channel each colour
# resolved to, then one line per completed colour cycle.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
