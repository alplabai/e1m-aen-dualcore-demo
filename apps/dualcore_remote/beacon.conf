#
# Optional bench diagnostic, NOT applied by default -- see ../Kconfig's
# CONFIG_DEMO_REMOTE_BEACON help text and src/main.c's top-of-file comment
# above beacon_write() for what this turns on and how to read the result off
# a memory dump. Pass this fragment explicitly:
#
#   west build ... apps/dualcore_remote -- -DEXTRA_CONF_FILE=beacon.conf
#
# Combine with coherent.conf (the R2 hypothesis fragment) with a
# semicolon-separated list if wanted:
#
#   west build ... apps/dualcore_remote -- -DEXTRA_CONF_FILE="beacon.conf;coherent.conf"
CONFIG_DEMO_REMOTE_BEACON=y
