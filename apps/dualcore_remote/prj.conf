# dualcore_remote -- RPMsg REMOTE. Builds for both the rtss_hp and rtss_he
# board qualifiers (see boards/*.overlay); which physical M55 cluster -- and
# so which console -- this image actually runs on depends on the board
# target passed to `west build`, not on anything in this app. See
# docs/BENCH-DUALCORE.md section 0 for which qualifier is bench-proven on
# which SoC, and the root README.md's console-assignment table for the
# per-target UART.
#
# CONFIG_MBOX / CONFIG_MBOX_ALIF_MHUV2 wire in the out-of-tree alif_mhuv2
# module (modules/alif-mhuv2) that backs the mhu_tx/mhu_rx nodes.
# CONFIG_IPC_SERVICE + CONFIG_IPC_SERVICE_BACKEND_RPMSG select the RPMsg
# static-vrings backend, matching the "zephyr,ipc-openamp-static-vrings"
# ipc0 node in the board overlay. CONFIG_OPENAMP is the backend's own
# dependency (see zephyr/samples/subsys/ipc/ipc_service/static_vrings/prj.conf).
CONFIG_MBOX=y
CONFIG_MBOX_ALIF_MHUV2=y
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG=y
CONFIG_OPENAMP=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=4096
