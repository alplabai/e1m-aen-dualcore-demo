#
# R2 hypothesis fragment: "the remote is up but the RPMsg bind never
# completes because the shared vring memory is cache-incoherent between the
# two M55 D-caches". Pass alongside beacon.conf:
#
#   west build ... apps/dualcore_remote -- -DEXTRA_CONF_FILE="beacon.conf;coherent.conf"
#
# THE NARROW FORM (mark only the shared vring/IPC region non-cacheable) WAS
# ALREADY IN PLACE BEFORE THIS FILE WAS WRITTEN -- it is not added here,
# because there is nothing left to add:
#
#   - boards/alp/e1m_aen/e1m_aen_*_rtss_{hp,he}.dts already tags the ipc0
#     backend's shared carve-out (&sram_ipc0, 0x02010000/64 KB -- the same
#     node both dualcore_host's and dualcore_remote's ipc0 overlays point
#     `memory-region` and `zephyr,ipc-shm` at) with
#     `zephyr,memory-attr = <(DT_MEM_ARM(ATTR_MPU_RAM_NOCACHE))>`.
#   - every e1m_aen board's *_defconfig already sets CONFIG_ARM_MPU=y (for
#     CONFIG_HW_STACK_PROTECTION), and subsys/mem_mgmt/Kconfig defaults
#     CONFIG_MEM_ATTR to y whenever CONFIG_ARM_MPU is y -- CONFIG_MEM_ATTR is
#     the option that turns a `zephyr,memory-attr` DT tag into an ACTUAL
#     programmed MPU region (arch/arm/core/mpu/arm_mpu.c:
#     mpu_configure_regions_from_dt(), gated on `#ifdef CONFIG_MEM_ATTR`) --
#     without it the tag is DT-only metadata with no runtime effect, which is
#     exactly the trap this whole investigation started from on the host
#     side (a `zephyr,memory-attr` on a region nobody ever turned into an MPU
#     region). Confirmed CONFIG_MEM_ATTR=y in a plain build of this app with
#     no fragments applied.
#   - Verified in a REAL LINKED BUILD of e1m_aen/ae822fa0e5597ls0/rtss_hp
#     (2026-07-31, no fragments applied -- i.e. R1's own build), not just
#     read off the DT source: the linked zephyr.elf's `mem_attr_region[]`
#     table (subsys/mem_mgmt/mem_attr.c) holds exactly two DT-tagged
#     entries -- PERIPHERALS (device) and SRAM_IPC0 (dt_addr=0x02010000,
#     dt_size=0x00010000, dt_attr=0x00200000 == DT_MEM_ARM_MPU_RAM_NOCACHE)
#     -- and the total static MPU region count (FLASH_0 + SRAM_0 from
#     arch/arm/core/mpu/arm_mpu_regions.c, plus these two from DT) is 4,
#     nowhere near this core's PMSAv8 region budget. That headroom matters
#     because CONFIG_ASSERT is OFF in this build (`# CONFIG_ASSERT is not
#     set`): arm_core_mpu_configure_static_mpu_regions() only reports a
#     region-table overflow via `__ASSERT(0, ...)`, which compiles to nothing
#     when ASSERT is off -- an overflow here would fail SILENTLY, not abort.
#     Checked that this is NOT happening (region count well under budget), so
#     the SRAM_IPC0 nocache region really is being programmed, not silently
#     dropped.
#
# So the shared vring/IPC memory is ALREADY MPU-non-cacheable on R1 too --
# the narrow form has no further code to change. R2's actual, meaningful
# delta from R1 is therefore the documented FALLBACK: CONFIG_DCACHE=n for
# the whole remote image. This is broader than the narrow form would have
# been (it also stops caching this core's DTCM globals/heap/stack, and the
# beacon words themselves before their explicit sys_cache_data_flush_range()
# calls), but it is what is left to try once the narrow form turns out to
# already be a no-op here -- see this app's README.md / the dispatch report
# this file was written against for what a difference (or lack of one)
# between R1 and R2 on the bench would and would not prove, given the above.
CONFIG_DCACHE=n
